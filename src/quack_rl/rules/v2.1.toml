# Quack RL ruleset v2.1. Human-readable rules: docs/rules/rules-v2.1.md
# Differences to v1.11: the `point_board` table (the points board with rat tails) and the die
# (the money face is gone, a +2 points face is new). Everything else is as in v1.11.
# Every number here is a tuning default. Never edit a version that has recorded games:
# make a new version file instead.
version = "v2.1"
spellbook = 1
rounds = 9
explosion_limit = 7      # potion explodes when the white total is more than this
# no overall purchase cap: remove White 1 has no count limit either
max_chip_purchases = 2   # shop items of kind "chip" per player per round
distinct_chip_colours = true  # at most one chip of each colour per player per round
track_end = 53
explosion_choice = true  # an exploded player chooses the money or the points of the scoring field
last_round_money_divisor = 5  # last round: money // this becomes points
start_rubies = 1         # rubies of each player at the start of the game
ruby_cost = 2            # rubies for one droplet +1 in the shop (action ruby_drop)

# Chips that every player gets into the bag at the start of the given round (card step, before the
# round card), for the rest of the game.
[[round_chips]]
round = 6
chip = "white_1"

