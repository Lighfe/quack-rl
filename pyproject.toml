[project]
name = "quack-rl"
version = "0.1.0"
description = "A simplified Quacks of Quedlinburg as a recorded game and RL environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",
    "pyarrow>=26.0.0",
]

[project.scripts]
quack-rl = "quack_rl.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quack_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds plan and spec code snippets, not project code; Ruff >= 0.16 formats Markdown too
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
